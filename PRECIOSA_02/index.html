<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nada más por hermosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="stage">
    <div class="frame">
      <div class="corner tl"><svg viewBox="0 0 56 56"><path d="M2 54 C2 20, 20 2, 54 2"/><circle cx="2" cy="54" r="2.2" fill="var(--wine)"/></svg></div>
      <div class="corner tr"><svg viewBox="0 0 56 56"><path d="M2 54 C2 20, 20 2, 54 2"/><circle cx="2" cy="54" r="2.2" fill="var(--wine)"/></svg></div>
      <div class="corner bl"><svg viewBox="0 0 56 56"><path d="M2 54 C2 20, 20 2, 54 2"/><circle cx="2" cy="54" r="2.2" fill="var(--wine)"/></svg></div>
      <div class="corner br"><svg viewBox="0 0 56 56"><path d="M2 54 C2 20, 20 2, 54 2"/><circle cx="2" cy="54" r="2.2" fill="var(--wine)"/></svg></div>

      <p class="eyebrow">de: mor</p>

      <p class="phrase">nada más por hermosaaaa<span class="accent">&lt;3</span></p>

      <div class="divider"></div>

      <p class="signature-line">— para Nicolle, ojitos lindos</p>
    </div>
  </div>

<script>
  // genera pétalos flotantes de forma dinámica, respetando el ancho de pantalla
  const total = window.innerWidth < 600 ? 10 : 18;
  for(let i=0;i<total;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (9 + Math.random()*8) + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    p.style.setProperty('--scale', 0.6 + Math.random()*0.8);

    const heart = document.createElement('div');
    heart.className = 'heart';
    p.appendChild(heart);

    document.body.appendChild(p);
  }
</script>

</body>
</html>
